<!DOCTYPE html>

  <style>
    .fc-app { max-width: 1100px; margin: 0 auto; padding: 1rem 1.25rem; }
    .fc-navbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-primary, #e5e7eb); }

    .fc-title { font-size: 1.25rem; font-weight: 600; margin: 0; }
    .fc-subtitle { font-size: 0.84rem; color: var(--text-secondary, #4b5563); margin: 0 0 0.9rem; }
    .fc-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
    .fc-tab { border: 1px solid var(--border-primary, #e5e7eb); background: #fff; color: var(--text-secondary, #4b5563); border-radius: 7px; padding: 0.5rem 0.85rem; font-size: 0.86rem; font-weight: 600; cursor: pointer; }
    .fc-tab.active { background: var(--text-primary, #111); border-color: var(--text-primary, #111); color: #fff; }
    .fc-panel { border: 1px solid var(--border-primary, #e5e7eb); border-radius: 10px; overflow: hidden; background: #fff; min-height: 72vh; }
    .fc-frame { width: 100%; height: 72vh; border: 0; }
    .fc-forbidden { text-align: center; padding: 3rem 2rem; color: var(--text-secondary, #4b5563); }
